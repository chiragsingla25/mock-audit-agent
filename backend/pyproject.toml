[project]
name = "mockaudit"
version = "0.1.0"
description = "Mock Audit Agent: a skeptical SOC 2 Type II auditor over synthetic evidence (portfolio MVP)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-openrouter>=0.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langsmith>=0.14",
    "pydantic>=2.14",
    "pyyaml>=6",
    "python-dotenv>=1",
    "fastapi>=0.143",
    "uvicorn>=0.30",
]

[project.scripts]
mockaudit = "mockaudit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "jupyter>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
