# Ledgerly SOC 2 controls under test (hand-written recipes). Period 2025-10-01 to 2026-09-30.
# `check` names a CHECKS entry (implemented in Phase 2); `check: null` is a judgment-only step.

- control_id: C1
  description: New access is approved before it is granted
  tsc: [CC6.2]
  frequency: event
  automated: false
  risk: high
  owner: IT Operations Manager
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: access_requests, path: exports/access_requests.csv, role: population, record_id_field: request_id}
    - {name: hr_roster, path: exports/hr_roster.csv, role: supporting, record_id_field: employee_id}
    - {name: access_control, path: policies/access_control.md, role: policy}
  test_recipe:
    - {id: approval, description: Each access grant has an approval timestamp at or before the grant,
       check: approval_before_grant, params: {source: access_requests, approved: approved_utc, granted: granted_utc}, judge: llm}

- control_id: C2
  description: Terminated users lose access within 24 hours
  tsc: [CC6.3]
  frequency: event
  automated: false
  risk: high
  owner: IT Operations Manager
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: hr_roster, path: exports/hr_roster.csv, role: independent, record_id_field: employee_id}
    - {name: okta_users, path: exports/okta_users.csv, role: supporting, record_id_field: user_id}
    - {name: okta_events, path: exports/okta_system_log.csv, role: population, record_id_field: event_id}
    - {name: access_control, path: policies/access_control.md, role: policy}
  test_recipe:
    - {id: completeness, description: Every HR termination with an Okta account appears in the deprovisioning population,
       check: population_diff, params: {left: hr_roster, right: okta_events, key: email, events: [user.lifecycle.suspend, user.lifecycle.deactivate]}, judge: llm}
    - {id: timeliness, description: First suspend or deactivate event within 24 clock hours of termination,
       check: revocation_delay, params: {max_hours: 24, events: [user.lifecycle.suspend, user.lifecycle.deactivate]}, judge: llm}

- control_id: C3
  description: User access is reviewed quarterly with reviewer sign-off
  tsc: [CC6.2]
  frequency: quarterly
  automated: false
  risk: high
  owner: IT Operations Manager
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: user_access_reviews, path: artifacts/access_reviews/, role: artifact, record_id_field: ID}
    - {name: okta_users, path: exports/okta_users.csv, role: supporting, record_id_field: user_id}
    - {name: access_control, path: policies/access_control.md, role: policy}
  test_recipe:
    - {id: occurrence, description: A user access review exists for each quarter in the period,
       check: periodic_occurrence, params: {source: user_access_reviews, prefix: UAR, every: quarter}, judge: none}
    - {id: signoff, description: Each review is signed by the reviewer within 10 business days of quarter end,
       check: null, judge: llm}

- control_id: C4
  description: MFA is enforced for all users
  tsc: [CC6.1]
  frequency: continuous
  automated: true
  risk: high
  owner: IT Operations Manager
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: okta_mfa_policy, path: exports/okta_mfa_policy.json, role: population, record_id_field: id}
    - {name: okta_groups, path: exports/okta_groups.csv, role: independent, record_id_field: group_id}
    - {name: access_control, path: policies/access_control.md, role: policy}
  test_recipe:
    - {id: coverage, description: An active MFA rule requiring a second factor covers every Okta group,
       check: config_assert, params: {policy: okta_mfa_policy, groups: okta_groups, require: factor_required}, judge: none}

- control_id: C5
  description: Privileged access is reviewed quarterly
  tsc: [CC6.3]
  frequency: quarterly
  automated: false
  risk: high
  owner: Head of Platform
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: aws_iam_admins, path: exports/aws_iam_admins.csv, role: independent, record_id_field: principal_id}
    - {name: privileged_access_reviews, path: artifacts/access_reviews/, role: artifact, record_id_field: ID}
    - {name: access_control, path: policies/access_control.md, role: policy}
  test_recipe:
    - {id: occurrence, description: A privileged access review exists for each quarter in the period,
       check: periodic_occurrence, params: {source: privileged_access_reviews, prefix: PAR, every: quarter}, judge: none}
    - {id: completeness, description: Every AWS admin that existed at the review date is on that quarter's reviewed list,
       check: set_mismatch, params: {left: aws_iam_admins, right: privileged_access_reviews, as_of: review_date}, judge: llm}
    - {id: signoff, description: Each review is signed within 10 business days of quarter end,
       check: null, judge: llm}

- control_id: C6
  description: Production changes are approved by someone other than the author
  tsc: [CC8.1]
  frequency: event
  automated: false
  risk: high
  owner: Head of Engineering
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: github_prs, path: exports/github_pull_requests.csv, role: population, record_id_field: pr_id}
    - {name: change_management, path: policies/change_management.md, role: policy}
  test_recipe:
    - {id: segregation, description: Every PR merged to main has at least one approver who is not the author,
       check: author_ne_approver, params: {source: github_prs, author: author, approvers: approvers}, judge: llm}

- control_id: C7
  description: Emergency changes are approved retroactively within 2 business days
  tsc: [CC8.1]
  frequency: event
  automated: false
  risk: moderate
  owner: Head of Engineering
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: deploys, path: exports/deploy_log.csv, role: population, record_id_field: deploy_id}
    - {name: jira_tickets, path: exports/jira_tickets.csv, role: supporting, record_id_field: key}
    - {name: change_management, path: policies/change_management.md, role: policy}
  test_recipe:
    - {id: ticketed, description: Every emergency deploy links an emergency change ticket,
       check: unticketed_deploys, params: {source: deploys, where: {change_type: emergency}, link: ticket}, judge: llm}
    - {id: retro_approval, description: Each emergency change ticket is approved within 2 business days of the deploy,
       check: sla_days, params: {start: deploys.deployed_utc, end: jira_tickets.approved_utc, days: 2, business: true}, judge: llm}

- control_id: C8
  description: Vulnerability scans run weekly and critical findings are fixed within 30 days
  tsc: [CC7.1]
  frequency: weekly
  automated: true
  risk: moderate
  owner: Security Lead
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: scanner_runs, path: exports/scanner_runs.csv, role: population, record_id_field: scan_id}
    - {name: vulnerabilities, path: exports/vulnerabilities.csv, role: population, record_id_field: vuln_id}
    - {name: jira_tickets, path: exports/jira_tickets.csv, role: supporting, record_id_field: key}
    - {name: vulnerability_management, path: policies/vulnerability_management.md, role: policy}
  test_recipe:
    - {id: weekly_scan, description: Each ISO week in the period has at least one completed scan,
       check: periodic_occurrence, params: {source: scanner_runs, date: started_utc, every: iso_week}, judge: none}
    - {id: critical_sla, description: Critical vulnerabilities are closed within 30 calendar days of being opened,
       check: sla_days, params: {source: vulnerabilities, where: {severity: critical}, start: opened_utc, end: closed_utc, days: 30, business: false}, judge: llm}

- control_id: C9
  description: Security incidents are logged and get a post-incident review
  tsc: [CC7.4]
  frequency: event
  automated: false
  risk: moderate
  owner: Security Lead
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: jira_tickets, path: exports/jira_tickets.csv, role: population, record_id_field: key}
    - {name: post_incident_reviews, path: artifacts/post_incident_reviews/, role: artifact, record_id_field: ID}
    - {name: incident_response, path: policies/incident_response.md, role: policy}
  test_recipe:
    - {id: pir, description: Every Incident ticket links a post-incident review document,
       check: required_link, params: {source: jira_tickets, where: {issue_type: Incident}, link: linked_doc, target: post_incident_reviews}, judge: llm}

- control_id: C10
  description: Security training is completed within 30 days of hire and annually
  tsc: [CC1.4]
  frequency: event
  automated: false
  risk: moderate
  owner: People Operations Lead
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: hr_roster, path: exports/hr_roster.csv, role: independent, record_id_field: employee_id}
    - {name: lms_completions, path: exports/lms_completions.csv, role: population, record_id_field: completion_id}
    - {name: security_training, path: policies/security_training.md, role: policy}
  test_recipe:
    - {id: new_hire, description: New hires complete new-hire security training within 30 days of their hire date,
       check: days_after_event, params: {event: hr_roster.hire_local, done: lms_completions.completed_local, course: Security Awareness - New Hire, days: 30}, judge: llm}
    - {id: annual, description: Employees employed throughout the annual campaign complete the annual course in the period,
       check: population_diff, params: {left: hr_roster, right: lms_completions, key: employee_id, course: Security Awareness - Annual 2026}, judge: none}

- control_id: C11
  description: Critical vendors are risk-reviewed annually
  tsc: [CC9.2]
  frequency: annual
  automated: false
  risk: moderate
  owner: Security Lead
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: vendor_register, path: exports/vendor_register.csv, role: population, record_id_field: vendor_id}
    - {name: vendor_management, path: policies/vendor_management.md, role: policy}
  test_recipe:
    - {id: review_in_period, description: Each critical vendor has a risk review dated within the period,
       check: date_in_period, params: {source: vendor_register, where: {criticality: critical}, date: last_risk_review_date}, judge: none}

- control_id: C12
  description: Backup restore is tested annually
  tsc: [A1.3]
  frequency: annual
  automated: false
  risk: moderate
  owner: Head of Platform
  period: [2025-10-01, 2026-09-30]
  evidence:
    - {name: restore_tests, path: artifacts/backup_restore_test_report.md, role: artifact, record_id_field: ID}
    - {name: backup_recovery, path: policies/backup_recovery.md, role: policy}
  test_recipe:
    - {id: restore_test, description: A restore test was performed and evidenced within the period,
       check: null, judge: llm}
