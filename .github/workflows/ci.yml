# Lint and tests on every push and PR. No secrets and no LLM calls: tests use stub models (CLAUDE.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # the committed GitHub Pages JSON validates against the schemas (moved here from Phase 4)
      - run: uv run mockaudit validate-showcase

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TypeScript types must match the Pydantic schemas they are generated from
      - run: npm run gen:types && git diff --exit-code -- schema.json lib/types.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
